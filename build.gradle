plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.5.0'

tasks.named('jar', Jar) {
    archiveClassifier = 'mc26.1'
    from('LICENSE')
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    compileOnly files(providers.gradleProperty('faktocraftJar')
            .orElse('../../Faktocraft/faktocraft-26.3-1.0.1.jar'))
}

neoForge {
    version = '26.1.0.19-beta'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        tofestechnograpple { sourceSet sourceSets.main }
    }
}
